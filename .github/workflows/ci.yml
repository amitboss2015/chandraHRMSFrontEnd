# ============================================
# CI Workflow - Build & Test on every PR
# ============================================
name: CI - Build & Test

on:
  pull_request:
    branches:
      - develop
      - master
  push:
    branches:
      - develop

jobs:
  build-and-test:
    name: Build & Test Frontend
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: 📥 Install dependencies
        run: npm ci

      - name: 🔍 Lint check
        run: npm run lint --if-present
        continue-on-error: true

      - name: 🔨 Build
        run: npm run build

      - name: 📤 Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          retention-days: 7

      - name: ✅ Build Success
        run: echo "Frontend build successful!"
